name: siaka_phones_flutter
description: "Siaka Phones Flutter Mobile Application - Next-Gen AMOLED Flagship Phone Store"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  video_player: ^2.14.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/


dependency_overrides:
  path_provider_android: 2.2.17
  shared_preferences_android: 2.2.4

